<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Road to Statuette — Share Score Preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#0a0708;overflow:hidden}
    iframe{display:block;border:0;width:100%;height:100%;background:#0a0708}
  </style>
</head>
<body>
  <iframe id="game" src="/road_to_statuette_WIKIDATA_Pix.html" title="Road to Statuette"></iframe>
  <script>
    const frame = document.getElementById('game');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc || doc.getElementById('share-score-inject')) return;
      const s = doc.createElement('script');
      s.id = 'share-score-inject';
      s.src = '/share-score-inject.js?v=1';
      doc.body.appendChild(s);
    });
  </script>
</body>
</html>
